[project]
name = "nba-over-under-total"
version = "0.1.0"
description = "Regressing home and away points over time per NBA match"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "lightgbm>=4.6.0",
    "nba-api>=1.10.2",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "ruff>=0.14.2",
    "scikit-learn>=1.7.2",
    "scikit-optimize>=0.10.2",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "xgboost>=3.1.1",
]
